name: Daily internship refresh

on:
  schedule:
    # GitHub cron is always in UTC. 10:07 UTC = 6:07 AM Eastern during daylight time (EDT, UTC-4)
    # and 5:07 AM Eastern during standard time (EST, UTC-5). Change 10 to 11 if you want 6 AM in
    # winter. The :07 avoids the top-of-the-hour rush, when GitHub often starts jobs late.
    - cron: "7 10 * * *"
  workflow_dispatch:   # lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write      # needed to commit the refreshed data back to the repo

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch, filter, merge, rebuild site
        run: python main.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Email digest (only when there are new postings)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          BOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python notify.py
