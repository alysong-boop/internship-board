# companies.yaml: which job feed each company is pulled from.
#
# ats:       workday | greenhouse | smartrecruiters | lever | ashby | manual
# verified:  live          = endpoint returned real postings on 2026-11-13
#            live-2026-11-10 = returned real postings on 2026-11-10 (earlier build of this board);
#                            could not be re-tested on 2026-11-13 because Workday's wd1/wd5 data
#                            centers were returning HTTP 521 for every company that day
# Workday endpoint = https://{tenant}.{dc}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs  (POST)
# manual = no usable public feed; the board just links careers_url.

supplementary:
  simplifyjobs:
    # Confirmed to exist: 17,660 listings, each tagged with terms like "Summer 2027".
    # Also catches "manual" companies (PepsiCo, Nestlé, ...) whenever the community lists them.
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    verified: live

